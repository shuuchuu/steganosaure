[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
]
dependencies = [
  "deal >= 4, < 5",
  "numpy >= 2, < 3",
  "scikit-image >= 0.25, < 1",
]
description = "Basic steganography package using numpy and scikit-image."
homepage = "https://github.com/shuuchuu/steganosaure"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "steganosaure"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.scripts]
steganosaure = "steganosaure.cli:main"

[dependency-groups]
dev = [
  "doit >= 0.37",
  "hypothesis >= 6, < 7",
  "pytest >= 9",
  "ruff >= 0.17",
  "ty >= 0.0.88",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
